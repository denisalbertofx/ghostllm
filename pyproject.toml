[project]
name = "ghost-llm"
version = "0.1.0"
description = "GhostLLM Monorepo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.52",
    "python-jose>=3.3.0",
    "bcrypt>=4.1.0",
    "prometheus-client>=0.20.0",
    "loguru>=0.7.2",
    "sqlmodel>=0.0.22",
    "jsonschema>=4.23.0",
    "pytest>=8.0.0",
]

[project.scripts]
ghost = "apps.cli.main:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
# Only include actual Python packages as uv workspace members.
workspace = { members = ["packages/py-core"] }

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages/py-core/ghostllm_core", "packages/py-core/ghost"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "configs"
"ghost.schema.json" = "ghost.schema.json"

[tool.hatch.build.targets.sdist]
include = [
    "apps/**/*.py",
    "packages/py-core/ghost/**/*.py",
    "packages/py-core/ghostllm_core/**/*.py",
    "configs/*.yaml",
    "ghost.schema.json",
    "README.md",
    "install/*.sh",
    "install/*.ps1",
    "ghost",
    "ghost.bat",
]

[tool.pytest.ini_options]
testpaths = ["apps", "packages", "tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
norecursedirs = [".ghost", ".git", ".next", ".turbo", "node_modules", ".venv", "venv", "build", "dist", "out", "worktrees", ".worktrees"]
addopts = "--ignore-glob=test*.txt"
