[project]
name = "ghostllm"
version = "0.1.0"
description = "GhostLLM Monorepo"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "rich>=13.7.0",
    "python-jose>=3.3.0",
    "bcrypt>=4.1.0",
    "prometheus-client>=0.20.0",
    "loguru>=0.7.2",
    "sqlmodel>=0.0.22",
    "pytest>=8.0.0",
]

[tool.uv]
managed = true
# Only include actual Python packages as uv workspace members.
workspace = { members = ["packages/py-core"] }
