[project]
name = "ghostllm-core"
version = "0.1.0"
description = "GhostLLM shared Python utilities"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "jsonschema>=4.23.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghostllm_core"]
