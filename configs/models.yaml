# GhostLLM Model Registry
# ========================
# Ghost CLI runtime uses role aliases (planner, execution, repair, chat, fallback).
# The gateway resolves alias → upstream_id using this file.
#
# Schema per entry:
#   name:        Alias used by the CLI / ENV vars (e.g. planner, coder, fast)
#   upstream_id: Full NIM model ID sent to the NVIDIA provider
#   enabled:     bool
#   expensive:   bool
#   tool_calling: bool

models:

  # ── Role Aliases ────────────────────────────────────────────────────────

  - name: "planner"
    upstream_id: "qwen/qwen3-coder-480b-a35b-instruct"
    description: "Qwen 3 Coder 480B A35B Planning"
    enabled: true
    expensive: true
    tool_calling: true

  - name: "execution"
    upstream_id: "qwen/qwen3-coder-480b-a35b-instruct"
    description: "Qwen 3 Coder 480B A35B Execution"
    enabled: true
    expensive: true
    tool_calling: true

  - name: "repair"
    upstream_id: "qwen/qwen3-coder-480b-a35b-instruct"
    description: "Qwen 3 Coder 480B A35B Repair"
    enabled: true
    expensive: true
    tool_calling: true

  - name: "chat"
    upstream_id: "meta/llama-3.1-8b-instruct"
    description: "Llama 3.1 8B Instruct"
    enabled: true
    expensive: false
    tool_calling: true

  - name: "fallback"
    upstream_id: "meta/llama-3.1-8b-instruct"
    description: "General fallback"
    enabled: true
    expensive: false
    tool_calling: true

  # ── Named Models ────────────────────────────────────────────────────────

  - name: "fast"
    upstream_id: "meta/llama-3.1-8b-instruct"
    enabled: true

  - name: "coder"
    upstream_id: "qwen/qwen3-coder-480b-a35b-instruct"
    enabled: true

  - name: "smart"
    upstream_id: "openai/gpt-oss-120b"
    enabled: true
    expensive: true
